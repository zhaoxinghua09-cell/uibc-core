name: version gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: version-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0 # v4
      - uses: actions/setup-python@v7.1.0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the package exactly as a client would
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Versions must agree across pyproject, manifest and runtime
        run: python tools/version_gate.py
