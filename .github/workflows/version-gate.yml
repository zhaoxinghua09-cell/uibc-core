name: version gate

# Two questions, one file:
#   1. do the version strings agree with each other (pyproject / server.json / runtime)?
#   2. does the tag carry the bytes it names (its own conformance archive)?
# The second question was missing until 2026-11-25. Its absence is why the lab
# bundle failed three releases in a row at "Build the bundle and measure the
# controls": the tag named 0.5.3 while the archive on that commit was 0.5.2.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: version-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0 # v4
      - uses: actions/setup-python@v7.1.0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the package exactly as a client would
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Versions must agree across pyproject, manifest and runtime
        run: python tools/version_gate.py

  readiness:
    # Runs only when a version tag is pushed: a release must be one set of bytes,
    # and this is the first step that can say so before anything is published.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0 # v4
      - uses: actions/setup-python@v7.1.0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The tag must carry its own archive and agree with the code
        run: |
          python tools/check_release_readiness.py \
            --version "${GITHUB_REF_NAME#v}" --tag "${GITHUB_REF_NAME}"
      - name: The archive must carry every digest a reader is told to check
        # MANIFEST.sha256 covers cases/ but not the five kit files the builder injects
        # at the archive top level. Measured 2026-11-25 on 0.5.5: all five had no
        # recorded digest, so a reader following the manifest could not check them.
        run: |
          python tools/verify_corpus.py \
            --archive "conformance/uibc-conformance-${GITHUB_REF_NAME#v}.zip" \
            --manifest conformance/MANIFEST.sha256 \
            --pin "anchors/pins/uibc-conformance-${GITHUB_REF_NAME#v}.sha256" \
            --archive-manifest "conformance/uibc-conformance-${GITHUB_REF_NAME#v}.ARCHIVE.sha256"
      - name: The published sdist must not carry the previous version's corpus
        # 0.5.4 shipped an sdist whose oracle corpus still said 0.5.3 (#460). This step
        # builds the sdist from the tagged tree and refuses stale version strings.
        run: |
          python -m pip install --quiet build
          python -m build --sdist --outdir dist .
          python tools/check_sdist_freshness.py \
            --sdist "$(ls dist/*.tar.gz | head -1)" --version "${GITHUB_REF_NAME#v}"
      - name: Say so on the run page when it passes
        run: |
          {
            echo "### Release readiness"
            echo ""
            echo "- tag: \`${GITHUB_REF_NAME}\`"
            echo "- version strings, archive and tag agree, the archive carries every digest, and the sdist carries no stale corpus."
          } >> "$GITHUB_STEP_SUMMARY"
