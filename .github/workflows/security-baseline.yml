name: security-baseline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install zizmor
        run: python -m pip install --upgrade pip && pip install zizmor
      - name: Run zizmor (GitHub Actions static analysis)
        run: zizmor --min-severity medium --no-progress .
        # ⚠️ advisory 期：首次接入，允许存量告警不阻断；清理后移除 continue-on-error 收紧
        continue-on-error: true
