name: Release lab bundle

# Runs when a maintainer pushes a version tag. It builds the release lab bundle
# (three controls measured in throwaway directories), checks it, and attaches the
# bundle, the receipt and the digest list to the GitHub release. It never publishes
# anything on its own: a tag push is a human decision.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the bundle to"
        required: true

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The anchors need asn1crypto. Measured 2026-11-20 on the first real run of this
      # workflow: the job installed nothing, so the token could not even be requested
      # and ANCHORS.json recorded `NameError: name 'tsp' is not defined` - a dependency
      # missing, published as if it were a defect. Failure here is recorded, not fatal.
      - name: Install what the anchors need
        continue-on-error: true
        run: |
          python -m pip install --quiet asn1crypto cryptography opentimestamps-client \
            || echo "could not install the anchor dependencies; ANCHORS.json will say unavailable"

      - name: Work out the version
        id: v
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Build the bundle and measure the controls
        run: |
          python tools/release_lab_bundle.py --version "${{ steps.v.outputs.version }}" --out release

      - name: Refuse a bundle that does not recompute
        run: |
          python tools/check_lab_bundle.py "release/uibc-lab-bundle-${{ steps.v.outputs.version }}.json" \
            --archive "release/uibc-conformance-${{ steps.v.outputs.version }}.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lab-bundle
          path: release/

      # The digest list is signed only when a seed exists, and the absence is shipped
      # as a file rather than implied. The seed is never echoed; it reaches the step
      # through env and is not written to disk in any form the artifact could carry.
      - name: Sign the digest list, or record that it is unsigned
        env:
          SEED: ${{ secrets.UIBC_RELEASE_SEED_HEX }}
        run: |
          if [ -n "$SEED" ]; then
            UIBC_RELEASE_SEED_HEX="$SEED" python tools/anchor_release_digests.py sign \
              --file release/CORPUS-DIGESTS.txt \
              --out-dir release \
              --note "signed by the release workflow for ${{ steps.v.outputs.tag }}"
            python tools/anchor_release_digests.py verify --sig release/CORPUS-DIGESTS.txt.sig \
              --file release/CORPUS-DIGESTS.txt
          else
            printf '%s\n' "No signing key was configured for this release (UIBC_RELEASE_SEED_HEX absent)." \
              "The digest list below is NOT signed. Verify it by recomputing the hashes, not by a signature." \
              > release/UNSIGNED.txt
            echo "no seed configured: release/UNSIGNED.txt written, nothing signed"
          fi

      # Both anchors are attempted and their failures are recorded rather than retried
      # into success. `anchor` writes ANCHORS.json with one state per output.
      - name: Try the two external anchors
        continue-on-error: true
        run: |
          python tools/anchor_release_digests.py anchor \
            --file release/CORPUS-DIGESTS.txt \
            --out-dir release || echo "anchor step did not complete; ANCHORS.json says so if it exists"

      - name: Show the anchor states
        run: |
          if [ -f release/ANCHORS.json ]; then cat release/ANCHORS.json; else echo "no ANCHORS.json"; fi

      # A tag push alone does not create a release, and `gh release upload` fails when
      # there is none. Measured 2026-11-20: the repository had a v0.4.1 tag and no v0.4.1
      # release, which is why the only release asset for this corpus was 0.4.0. This step
      # opens the release if the tag has none, so the four artifacts have somewhere to go.
      - name: Open the release if the tag has none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" > /dev/null 2>&1; then
            echo "release already exists for ${{ steps.v.outputs.tag }}"
          else
            gh release create "${{ steps.v.outputs.tag }}" \
              --title "${{ steps.v.outputs.tag }}" \
              --generate-notes
            echo "created release ${{ steps.v.outputs.tag }}"
          fi

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.v.outputs.tag }}" \
            "release/uibc-conformance-${{ steps.v.outputs.version }}.zip" \
            "release/uibc-lab-bundle-${{ steps.v.outputs.version }}.json" \
            "release/CORPUS-DIGESTS.txt" \
            "release/receipt.json" \
            --clobber
          # Each optional artifact is attached only when it exists, so a missing signature
          # shows up as a missing file plus UNSIGNED.txt, never as a silent success.
          for f in release/CORPUS-DIGESTS.txt.sig release/anchor_freetsa.tsr \
                   release/anchor_freetsa_ca.pem release/CORPUS-DIGESTS.txt.ots \
                   release/ANCHORS.json release/UNSIGNED.txt; do
            if [ -f "$f" ]; then
              gh release upload "${{ steps.v.outputs.tag }}" "$f" --clobber
            else
              echo "not attached (absent): $f"
            fi
          done
