name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        # The `verify` extra is installed on purpose: without it 17 tests exercise a
        # fallback instead of the real verification path (measured on 3.12, 2026-11-17).
        run: python -m pip install --upgrade pip && pip install pytest ".[verify]"

      - name: Run test suite
        run: python -m pytest tests -q
