<line x1="40" y1="434" x2="1000" y2="434" stroke="#dfe3e8" stroke-width="1"/>
<text x="40" y="470" font-size="12.5" fill="#1b1b1b">Four rows point their way. Two point ours, and they are the two a test count cannot buy: a second implementation, and a suite a stranger can run.</text>
<text x="40" y="490" font-size="11" fill="#6b7280">What is still missing is not more tests. It is the I-D, the release, and one outside person running the 36 packages.</text>
