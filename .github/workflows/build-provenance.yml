name: build-provenance

# G-07/G-26 five-piece set, piece 5: signed build provenance.
# Every sdist/wheel shipped from this repository gets an OIDC-signed
# attestation (SLSA build provenance), so consumers can verify the artifact
# was built by this repository's GitHub Actions, not re-hosted or tampered.
# Pinned actions to commit SHAs (Scorecard Pinned-Dependencies).
#
# FIX (audit 2026-10-29): the attestation step failed with
# "Resource not accessible by integration" because the job token lacked the
# `attestations: write` scope required by the GitHub Attestations API
# (POST /repos/{owner}/{repo}/attestations). `id-token: write` alone is NOT
# enough — it only grants the OIDC token. `attestations: write` is the
# minimum additional permission needed to persist the attestation.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # OIDC token for sigstore / SLSA provenance
      attestations: write  # REQUIRED to persist the attestation via the Attestations API
      contents: read       # checkout source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: |
          python -m pip wheel --wheel-dir .ci-wheels build
          python -m pip install --no-deps .ci-wheels/*.whl

      - name: Build sdist and wheel
        run: python -m build

      - name: Generate artifact attestation (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Upload build artifacts
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: dist
          path: dist/

  # The outsider is told to download one file: the pinned conformance archive.
  # Provenance for it is a different claim from provenance for a wheel — this
  # archive is committed, not rebuilt here — so it gets its own attestation rather
  # than being folded into the one above. What it proves is that the exact bytes
  # were present in this repository, under this commit, in a run this repository's
  # workflow signed with its OIDC identity. What it does not prove is that the
  # archive was produced by a hermetic build; the page says so in those words.
  attest-conformance:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: State the digest being attested
        run: |
          sha256sum conformance/uibc-conformance-0.7.0.zip
          wc -c conformance/uibc-conformance-0.7.0.zip

      - name: Generate artifact attestation for the conformance archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "conformance/uibc-conformance-0.7.0.zip"
