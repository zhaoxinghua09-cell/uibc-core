name: one-click outsider run

# Manual only. This exists so that a person who does not want to install
# anything can click one button on a machine neither they nor we control, and
# get the same line the README asks for. The run is public and timestamped;
# it is a machine run, not a third-party human node, and docs/EXTERNAL-NODES.md
# is the only place where a node is counted.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    name: external node check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run the outsider check
        shell: bash
        run: |
          set -o pipefail
          python tools/external_node_check.py --out external_node_result.json | tee run.txt

      - name: Run the SEP-2828 demo (no corpus, no account)
        shell: bash
        run: |
          python tools/sep2828_carriage.py --demo \
            --out demo_sep2828.json --html demo_sep2828.html | tee demo.txt

      - name: Record the result on the run page
        shell: bash
        run: |
          {
            echo "### One-click outsider run"
            echo ""
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- python: $(python --version 2>&1)"
            echo "- runner: $RUNNER_OS $RUNNER_ARCH (GitHub-hosted)"
            echo ""
            echo '```'
            cat run.txt
            echo '```'
            echo ""
            echo "sha256 of external_node_result.json: \`$(sha256sum external_node_result.json | cut -d' ' -f1)\`"
            echo ""
            echo "### SEP-2828 carriage demo (no corpus, no account)"
            echo ""
            echo '```'
            tail -n 6 demo.txt
            echo '```'
            echo ""
            echo "The demo writes its four fixtures itself and then changes one byte"
            echo "after sealing. They are not the corpus's cases -- the corpus belongs"
            echo "to its authors and is not vendored here."
            echo ""
            echo "This is a machine run on a hosted runner. It is not a third-party"
            echo "human node, and it is not counted in docs/EXTERNAL-NODES.md."
            echo "The demo fixtures are generated by the tool, not taken from any"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the result file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-node-result
          path: |
            external_node_result.json
            run.txt
            demo.txt
            demo_sep2828.json
            demo_sep2828.html
          retention-days: 90
