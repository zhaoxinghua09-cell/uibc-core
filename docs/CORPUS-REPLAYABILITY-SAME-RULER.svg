<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" font-family="DejaVu Sans, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="44" font-size="21" font-weight="600" fill="#111">One ruler, two corpora</text>
<text x="24" y="70" font-size="14" fill="#444">same fold functions, same classification rule &#183; a ratio is only a comparison when both sides are measured</text>
<rect x="24" y="96" width="14" height="14" fill="#1f5fa8"/>
<text x="46" y="108" font-size="13" fill="#333">replayable from the file's own numbers</text>
<rect x="300" y="96" width="14" height="14" fill="#c9cdd3"/>
<text x="322" y="108" font-size="13" fill="#333">published, but not replayable without their code</text>
<text x="24" y="168" font-size="15" fill="#222">their corpus: probityai/agent-evidence-vectors</text>
<text x="24" y="186" font-size="12" fill="#666">39daf704 &amp;#183; inclusion 37/37, consistency 23/23, canonical 9/9, token 0/87, chain 0/15</text>
<rect x="300" y="152" width="640.0" height="28" fill="#c9cdd3" rx="3"/>
<rect x="300" y="152" width="258.2" height="28" fill="#1f5fa8" rx="3"/>
<text x="954.0" y="172" font-size="14" fill="#333">69 / 171 (40%)</text>
<text x="24" y="268" font-size="15" fill="#222">our corpus: scitt-rfc9162 v1</text>
<text x="24" y="286" font-size="12" fill="#666">every vector also judged by pymerkle / Sigstore / Go &amp;#183; inclusion 50/50, consistency 13/13</text>
<rect x="300" y="252" width="235.8" height="28" fill="#c9cdd3" rx="3"/>
<rect x="300" y="252" width="235.8" height="28" fill="#1f5fa8" rx="3"/>
<text x="549.8" y="272" font-size="14" fill="#333">63 / 63 (100%)</text>
<text x="24" y="378" font-size="14" fill="#111">63 of 63 replayable here, 69 of 171 there &#183; 0 contradictions on either side.</text>
<text x="24" y="406" font-size="12" fill="#666">receipts: docs/upstream-package/competitor-defects/corpus-sweep-39daf704.json and docs/upstream-package/measurements/own-corpus-replay.json &#183; regenerate with tools/build_same_ruler_svg.py --write</text>
<text x="24" y="426" font-size="12" fill="#666">4 of our 63 say VALID_BUT_SIZE_UNAUTHENTICATED - the root authenticates the leaves, not the declared size - and stay counted as such.</text>
</svg>
