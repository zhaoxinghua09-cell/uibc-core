<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">

<style>
:root{--bg:#0f1115;--fg:#e8eaed;--dim:#9aa0a6;--ok:#34a853;--bad:#ea4335;--warn:#fbbc04;--card:#171a21}

</style></head><body><div class="wrap">
<h1>双实现一致性矩阵</h1>
<div class="sub">同一批磁盘字节喂两个验证器 · 语料 30 例 · as of 2026-11-25 · 数据内嵌，可离线打开</div>
<div class="cards" id="cards"></div>
<div class="legend">判定：<span class="ok">✓</span> 两实现一致；<span class="warn">▣</span> 覆盖缺口（该读者没有这项检查）；<span class="bad">✗</span> 同号不同力度或接受类分歧。</div>
<table><thead><tr><th>案例</th><th>模式</th><th>期望</th><th>参考</th><th>独立</th><th>首失败 参考/独立</th><th>分类</th></tr></thead>
<tbody id="rows"></tbody></table>
<div class="note">独立读者只有 V1–V10，覆盖 10/19 项检查；未覆盖 S9 S11 S13 S14 S15 S16 S17 S18 S19。两例真矛盾（S12 只重复条目、S10 闭包）说明“同号不同力度”比“缺检查”更难发现——所以本页不放行“跨实现验证”这个说法。</div>
</div>
<script>
const D = {"summary": {"cases": 30, "compared": 30, "errors": 0, "verdict_agree": 20, "first_agree": 17, "set_agree": 14, "both_match_oracle": 18, "coverage_gap": 7, "contradiction": 2, "accept_divergence": 1, "covered_checks": 10, "uncovered_checks": ["S9", "S11", "S13", "S14", "S15", "S16", "S17", "S18", "S19"], "as_of": "2026-11-25"}, "rows": [{"case": "oracle-clean", "mode": "strict", "expected": "PASS", "ref": "PASS", "ind": "PASS", "verdict_agree": true, "ref_first": null, "ind_first": null, "first_agree": true, "ref_set": [], "ind_set": [], "set_agree": true, "both_match_oracle": true, "designed_uncovered": [], "kind": "agree"}, {"case": "oracle-tampered", "mode": "strict", "expected": "FAIL", "ref": "FAIL", "ind": "FAIL", "verdict_agree": true, "ref_first": "S4", "ind_first": "S4", "first_agree": true, "ref_set": ["S4", "S8"], "ind_set": ["S4"], "set_agree": false, "both_match_oracle": true, "designed_uncovered": [], "kind": "agree"}, {"case": "oracle-deleted", "mode": "strict", "expected": "FAIL", "ref": "FAIL", "ind": "FAIL", "verdict_agree": true, "ref_first": "S4", "ind_first": "S4", "first_agree": true, "ref_set": ["S4", "S8"], "ind_set": ["S4"], "set_agree": false, "both_match_oracle": true, "designed_uncovered": [], "kind": "agree"}, {"case": "oracle-duplicated", "mode": "strict", "expected": "FAIL", "ref": "FAIL", "ind": "FAIL", "verdict_agree": true, "ref_first": "S5", "ind_first": "S5", "first_agree": true, "ref_set": ["S5", "S7", "S8", "S12"], "ind_set": ["S5", "V8", "V9"], "set_agree": false, "both_match_oracle": true, "designed_uncovered": [], "kind": "agree"}, {"case": "oracle-unsealed", "mode": "strict", "expected": "FAIL", "ref": "FAIL", "ind": "FAIL", "verdict_agree": true, "ref_first": "S6", "ind_first": "S6", "first_agree": true, "ref_set": ["S6"], "ind_set": ["S6"], "set_agree": true, "both_match_oracle": true, "designed_uncovered": [], "kind": "agree"}, {"case": "oracle-s12-id-only", "mode": "strict", "expected": "FAIL", "ref": "FAIL", " first": null, "first_agree": false, "ref_set": ["S11"], "ind_set": [], "set_agree": false, "both_match_oracle": false, "designed_uncovered": ["S11"], "kind": "coverage-gap"}, {"case": "oracle-s13-merkle-root", "mode": "open", "expected": "FAIL", "ref": "FAIL", "ind": "INCONCLUSIVE", "verdict_agree": false, "ref_first": "S13", "ind_first": null, "first_agree": false, "ref_set": ["S13"], "ind_set": [], "set_agree": false, "both_match_oracle": false, "designed_uncovered": ["S13"], "kind": "coverage-gap"}, {"case": "oracle-s14-base64-padding", "mode": "open", "expected": "FAIL", "ref": "FAIL", "ind": "INCONCLUSIVE", "verdict_agree": false, "ref_first": "S14", "ind_first": null, "first_agree": false, "ref_set": ["S14"], "ind_set": [], "set_agree": false, "both_match_oracle": false, "designed_uncovered": ["S14"], "kind": "coverage-gap"}, {"case": "oracle-s15-anchor-time", "mode": "open", "expected": "FAIL", "ref": "FAIL", "ind": "INCONCLUSIVE", "verdict_agree": false, "ref_first": "S15", "ind_first": null, "first_agree": false, "ref_set": ["S15"], "ind_set": [], "set_agree": false, "both_match_oracle": false, "designed_uncovered": ["S15"], "kind": "coverage-gap"}, {"case": "oracle-s16-token-byte", "mode": "open", "expected": "FAIL", "ref": "FAIL", "ind": "INCONCLUSIVE", "verdict_agree": false, "ref_first": "S16", "ind_first": null, "first_agree": false, "ref_set": ["S16"], "ind_set": [], "set_agree": false, "both_match_oracle": false, "designed_uncovered": ["S16"], "kind": "coverage-gap"}, {"case": "oracle-s17-receipt-body", "mode": "open", "expected": "FAIL", "ref": "FAIL", "ind": "INCONCLUSIVE", "verdict_agree": false, "ref_first": "S17", "ind_first": null, "first_agree": false, "ref_set": ["S17"], "ind_set": [], "set_agree": false, "both_match_oracle": false, "designed_uncovered": ["S17"], "kind": "coverage-gap"}, {"case": "oracle-s18-policy-artefact", "mode": "open", "expected": "FAIL", "ref": "FAIL", "ind": "INCONCLUSIVE", "verdict_agree": false, "ref_first": "S18", e"}, {"case": "accept-resubmitted", "mode": "strict", "expected": "PASS", "ref": "PASS", "ind": "PASS", "verdict_agree": true, "ref_first": null, "ind_first": null, "first_agree": true, "ref_set": [], "ind_set": [], "set_agree": true, "both_match_oracle": true, "designed_uncovered": [], "kind": "agree"}, {"case": "accept-typed-evidence", "mode": "strict", "expected": "PASS", "ref": "PASS", "ind": "PASS", "verdict_agree": true, "ref_first": null, "ind_first": null, "first_agree": true, "ref_set": [], "ind_set": [], "set_agree": true, "both_match_oracle": true, "designed_uncovered": [], "kind": "agree"}, {"case": "accept-lifecycle-events", "mode": "strict", "expected": "PASS", "ref": "PASS", "ind": "PASS", "verdict_agree": true, "ref_first": null, "ind_first": null, "first_agree": true, "ref_set": [], "ind_set": [], "set_agree": true, "both_match_oracle": true, "designed_uncovered": [], "kind": "agree"}, {"case": "accept-anchored-policy", "mode": "strict", "expected": "PASS", "ref": "PASS", "ind": "INCONCLUSIVE", "verdict_agree": false, "ref_first": null, "ind_first": null, "first_agree": true, "ref_set": [], "ind_set": [], "set_agree": true, "both_match_oracle": false, "designed_uncovered": [], "kind": "accept-divergence"}, {"case": "oracle-s09-rollback-pin", "mode": "strict", "expected": "FAIL", "ref": "PASS", "ind": "PASS", "verdict_agree": true, "ref_first": null, "ind_first": null, "first_agree": true, "ref_set": [], "ind_set": [], "set_agree": true, "both_match_oracle": false, "designed_uncovered": ["S9"], "kind": "agree"}, {"case": "oracle-s19-stale-state", "mode": "strict", "expected": "FAIL", "ref": "PASS", "ind": "PASS", "verdict_agree": true, "ref_first": null, "ind_first": null, "first_agree": true, "ref_set": [], "ind_set": [], "set_agree": true, "both_match_oracle": false, "designed_uncovered": ["S19"], "kind": "agree"}]};
const c = D.summary;
const cards = [
 ["案例", c.cases, ""], ["判定一致", c.verdict_agree + "/" + c.compared, c.verdict_agree === c.compared ? "ok" : "warn"],
 ["失败集一致", c.set_agree, c.set_agree === c.compared ? "ok" : "warn"],
 ["覆盖缺口", c.coverage_gap, "warn"], ["真矛盾", c.contradiction, c.contradiction ? "bad" : "ok"],
 ["接受类分歧", c.accept_divergence, c.accept_divergence ? "bad" : "ok"],
 ["覆盖检查", c.covered_checks + "/19", c.covered_checks === 19 ? "ok" : "bad"]

document.getElementById("cards").innerHTML = cards.map(([k,v,cls]) =>
 `<div class="card"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`).join("");
const kindMap = {agree:["ok","✓ 一致"], "coverage-gap":["warn","▣ 覆盖缺口"],

document.getElementById("rows").innerHTML = D.rows.map(r => r.error
 ? `<tr><td>${r.case}</td><td colspan="6" class="bad">${r.error}</td></tr>`
 : `<tr><td>${r.case}</td><td>${r.mode||"—"}</td><td>${r.expected}</td><td>${r.ref}</td><td>${r.ind}</td>
    <td>${r.ref_first||"—"} / ${r.ind_first||"—"}</td>
    <td class="${kindMap[r.kind][0]}">${kindMap[r.kind][1]}</td></tr>`).join("");
</script></body></html>
