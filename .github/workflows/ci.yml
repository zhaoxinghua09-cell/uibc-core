name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Measured 2026-11-28: nothing in this repository had ever linted the Python.
  # CodeQL covers security patterns and the suite covers behaviour, so both stayed
  # green while three things sat in the tree untouched: a helper in tools/ that
  # called an undefined KEY (dead, but only because nobody had called it), a test
  # module that referenced pytest.skip without importing pytest (so its skip path
  # could only ever raise NameError), and a duplicated import that made one of two
  # definitions silently win. A gate that cannot fail is not a gate, and none of
  # these three could fail. ruff runs over the whole tree with E9+F only - the
  # rules that find bugs, not the ones that argue about layout - and the tree was
  # cleaned to zero before this job was added, so it starts green and stays green.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ruff
        # Pinned to the version that produced the clean run, and fetched the same
        # way as every other dependency (wheel into .ci-wheels, then installed by
        # wheel name) so the supply-chain check keeps counting this as pinned.
        run: |
          python -m pip wheel --wheel-dir .ci-wheels ruff==0.17.6
          python -m pip install --no-deps .ci-wheels/*.whl
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: one test recomputes an outside host's figures at an
          # older commit (8a95747). A shallow clone cannot name it, and a test
          # that silently skips would be a test that cannot fail.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        # The `verify` extra is installed on purpose: without it 17 tests exercise a
        # fallback instead of the real verification path (measured on 3.12, 2026-11-17).
        run: |
          python -m pip wheel --wheel-dir .ci-wheels pytest ".[verify]"
          python -m pip install --no-deps .ci-wheels/*.whl

      - name: Install the package (exercises the build backend + console entry point)
        run: |
          python -m pip wheel --wheel-dir .ci-wheels .
          python -m pip install --no-deps .ci-wheels/*.whl

      - name: Run test suite
        run: python -m pytest tests -q

      - name: The status page still matches its sources
        # STATUS.md is generated; this step is what keeps it from drifting into a claim.
        # Exit 0 current, 1 stale, 3 a source unreadable - all three fail the job.
        run: python tools/status_page.py --check

      - name: The documented way in still points at the pinned archive
        # Measured 2026-11-20: the "run it without cloning" paragraph named no URL, and
        # the only release carries a different archive. --probe needs the network and
        # runs by hand; here the local pin and the documents are held together.
        run: python tools/check_outsider_entry.py

  # Measured 2026-11-19: 15 of the 16 skipped tests were skipping for one reason only -
  # `.[verify]` does not carry agent-action-capsule, langchain-core, opentimestamps-client,
  # pynostr or coincurve, so the interop, live-agent, anchor and RFC 3161-proof checks had
  # never run in CI at all. They pass once those packages are present. This job installs
  # them and fails if any skip still says "not installed", so a green matrix can no longer
  # mean "the hard half was skipped".
  # Measured 2026-11-23: the suite had never run on macOS. Windows-only branches
  # (`msvcrt` locking) and POSIX-only branches (`fcntl`) are not the same code path,
  # so a green Ubuntu matrix said nothing about either. This job runs the full
  # suite on a second POSIX flavour; the lock test is what actually differs.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install test deps
        run: |
          python -m pip wheel --wheel-dir .ci-wheels pytest ".[verify]"
          python -m pip install --no-deps .ci-wheels/*.whl

      - name: The platform-dependent branches, named
        run: python -c "import platform,sys; print(platform.platform(), sys.version)"

      - name: Run the suite
        run: python -m pytest tests -q

      - name: The lock, on this platform
        # The only code that differs between Linux and macOS here is the file lock.
        # A green suite that silently skipped it would not be evidence.
        run: python -m pytest tests -q -k "lock or concurrent"

  # Measured 2026-11-23: a plain Windows clone with the Git-for-Windows default
  # `core.autocrlf=true` turned 1,328 tracked files into CRLF and failed 47 tests,
  # every one of them a byte hash. `.gitattributes` now states the rule for every
  # path (see the header of that file). This job re-creates the historical
  # condition and fails if any later edit narrows a rule again - the failure mode
  # cannot be reproduced on a Linux runner, so it needs its own job.
  windows-clone-bytes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install test deps
        shell: bash
        run: |
          python -m pip wheel --wheel-dir .ci-wheels pytest ".[verify]"
          python -m pip install --no-deps .ci-wheels/*.whl

      - name: Re-checkout the tree the way Git-for-Windows does by default
        shell: bash
        run: |
          git config --global core.autocrlf true
          git config --global core.eol native
          git config --local core.autocrlf true
          git rm --cached -r -q .
          git reset --hard -q
          git config --show-origin core.autocrlf || true

      # The measurement and the verdict are split on purpose. Job logs are not
      # readable through the API for this repository (401/404), so the numbers
      # this job acts on are also published as an artefact. A check nobody can
      # read is a check that cannot be argued with.
      - name: Measure where this checkout differs from the stored blobs
        shell: bash
        run: |
          python - <<'PY'
          # The first version of this job asserted "no file may contain CRLF" and
          # failed at once: 83 files carry CRLF *inside their blobs*, so every
          # platform receives them and no platform is wrong. The defect that cost
          # 47 tests is narrower and this is the honest form of it -- the worktree
          # disagrees with the blob the hash was recorded over. `git ls-files --eol`
          # states exactly that, per file, and needs no test runner.
          import hashlib, json, pathlib, subprocess

          raw = subprocess.run(["git", "ls-files", "--eol"], capture_output=True,
                              text=True, encoding="utf-8", errors="replace")
          diverged, stored_crlf = [], []
          for line in raw.stdout.splitlines():
              if not line.strip():
                  continue
              meta, _, path = line.partition("\t")
              parts = meta.split()
              i_eol = next((p for p in parts if p.startswith("i/")), "")
              w_eol = next((p for p in parts if p.startswith("w/")), "")
              if w_eol == "w/crlf" and i_eol == "i/lf":
                  diverged.append(path)
              elif i_eol == "i/crlf":
                  stored_crlf.append(path)

          root = pathlib.Path("docs/spec-sources")
          manifest = json.loads((root / "MANIFEST.json").read_text(encoding="utf-8"))
          bad = []
          for doc in manifest["documents"]:
              got = hashlib.sha256((root / doc["file"]).read_bytes()).hexdigest()
              if got != doc["sha256"]:
                  bad.append({"file": doc["file"], "want": doc["sha256"], "got": got})

          report = {
              "files_diverged_from_blob": diverged,
              "blobs_stored_with_crlf": len(stored_crlf),
              "sources_checked": len(manifest["documents"]),
              "sources_mismatched": bad,
              "git_files_seen": raw.stdout.count("\n"),
          }
          pathlib.Path("windows-bytes.json").write_text(
              json.dumps(report, indent=2), encoding="utf-8")
          print("diverged:", len(diverged), "stored-CRLF blobs:", len(stored_crlf),
                "digest mismatches:", len(bad))
          PY

      - name: Publish the measurement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-bytes
          path: windows-bytes.json
          if-no-files-found: error

      - name: No file may disagree with the blob its hash was recorded over
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, sys
          report = json.loads(pathlib.Path("windows-bytes.json").read_text(encoding="utf-8"))
          ok = True
          if report["files_diverged_from_blob"]:
              print("files whose bytes differ from their blob:", len(report["files_diverged_from_blob"]))
              for p in report["files_diverged_from_blob"][:40]:
                  print("  ", p)
              ok = False
          if report["sources_mismatched"]:
              print("digest mismatches:", len(report["sources_mismatched"]))
              for e in report["sources_mismatched"]:
                  print("  ", e["file"], "want", e["want"][:12], "got", e["got"][:12])
              ok = False
          print("tracked files:", report["git_files_seen"],
                "blobs that store CRLF:", report["blobs_stored_with_crlf"],
                "sources checked:", report["sources_checked"])
          sys.exit(0 if ok else 1)
          PY

  test-with-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: one test recomputes an outside host's figures at an
          # older commit (8a95747). A shallow clone cannot name it, and a test
          # that silently skips would be a test that cannot fail.
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install the suite with every optional dependency present
        run: |
          python -m pip wheel --wheel-dir .ci-wheels pytest ".[verify,interop,conformance]"
          python -m pip install --no-deps .ci-wheels/*.whl

      - name: Run the whole suite and refuse a dependency-shaped skip
        run: |
          set -o pipefail
          python -m pytest tests -q -rs | tee /tmp/pytest.txt
          ! grep -E "not installed|pip install agent-action-capsule" /tmp/pytest.txt

  # Measured 2026-11-19: the first 0.4.0 sdist carried tests/ but not the
  # data they read. Unpacked, it collected 290 of 526 tests with 6 failures and
  # 97 errors, every one of them "no such file". "526 tests green" was true of
  # a git clone and false of the package an installer receives. This job makes
  # a missing directory in MANIFEST.in fail the pull request instead.
  sdist-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: one test recomputes an outside host's figures at an
          # older commit (8a95747). A shallow clone cannot name it, and a test
          # that silently skips would be a test that cannot fail.
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build an sdist
        run: |
          python -m pip wheel --wheel-dir .ci-wheels build
          python -m pip install --no-deps .ci-wheels/*.whl
          python -m build --sdist

      - name: Run the suite from the unpacked archive
        run: |
          mkdir -p /tmp/sd
          tar xzf dist/uibc_core-*.tar.gz -C /tmp/sd
          cd /tmp/sd/uibc_core-*
          python -m pip wheel --wheel-dir .ci-wheels pytest ".[verify]"
          python -m pip install --no-deps .ci-wheels/*.whl
          python -m pytest tests -q

      - name: Assert the archive carried the whole suite
        # A suite that silently collected fewer tests would still be green.
        run: |
          cd /tmp/sd/uibc_core-*
          python -m pytest tests --collect-only -q > /tmp/collected.txt 2>&1 || true
          n=$(grep -c "::" /tmp/collected.txt || true)
          echo "collected: $n"
          test "$n" -ge 500

  # REPRODUCTION-REGISTER.md states that a row must be reproducible from what it
  # states (rule 4). Until this job existed, that was prose: a row could carry a
  # 6-character hash and look exactly as authoritative as a real one. This job
  # makes the file fail when a row cannot be checked, including the row a
  # stranger opens as a PR.
  register-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: The checker's own tests
        run: |
          python -m pip wheel --wheel-dir .ci-wheels pytest
          python -m pip install --no-deps .ci-wheels/*.whl
          python tools/check_register_row.py --self-test
          python -m pytest tests/test_register_row.py -q

      - name: Every row in the shipped register is well formed
        run: python tools/check_register_row.py --register REPRODUCTION-REGISTER.md

  second-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: one test recomputes an outside host's figures at an
          # older commit (8a95747). A shallow clone cannot name it, and a test
          # that silently skips would be a test that cannot fail.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install test deps
        run: |
          python -m pip wheel --wheel-dir .ci-wheels pytest ".[verify]"
          python -m pip install --no-deps .ci-wheels/*.whl

      - name: Node the runner already ships is enough
        run: node --version

      - name: Export the conformance suite
        run: python tools/export_conformance.py

      - name: Hostile input is a verdict, not a traceback
        # Ten inputs that are not packages: not JSON, a NaN literal, 4000
        # levels of nesting, invalid UTF-8, a path climbing out of the package,
        # a symlink to the host, an empty directory, an 8 MB manifest. Both
        # implementations must answer, and both must refuse. A crash is not a
        # verdict, and "could not tell" about bytes nobody judged is the one
        # wrong answer that looks honest.
        run: python tools/redteam_robustness.py

      - name: Two implementations, one set of failing checks
        # Not the weaker "names an expected check": the same set, on all 36.
        run: python tools/cross_impl_check.py --json | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['agree_with_python']==d['cases'], d; print('agree', d['agree_with_python'], 'of', d['cases'])"

      - name: The tree digest has a second implementation too
        # Node's standard library recomputes tree_sha256 and content_sha256 from
        # the same membership; this fails if the two ever disagree, i.e. if the
        # number the receipt leans on becomes one program's private convention.
        run: python tools/tree_digest_second_impl.py --check

      - name: A competitor's "reject" must come from the numbers
        # Three vectors from probityai/agent-evidence-vectors v0.38.0 declare an
        # empty tree and carry a non-empty-tree root, so their published reject is
        # forced by the input contradicting itself. The step fails if their files
        # ever start agreeing with their own published code without the constant
        # changing - i.e. if this stops being true, we want to know, not to keep an
        # old page. The counter-vectors are the control: they must all agree.
        run: |
          python tools/check_competitor_vectors.py --self-test
          # Only two of the five categories in the upstream corpus can be replayed
          # with arithmetic alone; the sweep has to keep saying which it cannot, and
          # its selftest fails if the classifier starts flattering us.
          python tools/sweep_competitor_corpus.py --selftest
          # And a sweep that reports zero contradictions has to be seen failing:
          # this one mutates a correct vector until the sweep refuses it, and keeps
          # the one blind spot it cannot see (a changed tree size) reported apart.
          python tools/sweep_mutation_control.py --selftest
          # The stranger's one-command check has to keep failing when bytes or
          # counts move, so its own failure paths are asserted here (no network).
          python tools/stranger_competitor_check.py --selftest
          # Two snapshots of the same corpus must keep comparing equal, by digest
          # rather than by memory (the older receipt ships no file list).
          python tools/compare_corpus_snapshots.py --selftest
          # The ledger says how far a stranger gets on each of the 171 (verdict /
          # signature-only / nothing); a column it cannot recompute is a column it
          # should not print. The selftest also re-reads the committed receipt and
          # asserts its rows still sum to its own total.
          python tools/build_upstream_ledger.py --selftest
          # Between a receipt and a sentence sat a person copying a number. Every
          # claim row that quotes a receipt carries a lock: annotation, and this
          # fails if the receipt moved without the prose or the prose without the
          # receipt. Unlocked rows are counted out loud, not silently passed.
          python tools/audit_claims_receipts.py
          python tools/audit_claims_receipts.py --selftest
          # The inclusion half of A18 is folded by construction by a
          # third-party implementation vendored in the tree; its selftest
          # has to keep showing a wrong root coming back as reject.
          python tools/crosscheck_competitor_inclusion_sigstore.py --selftest
          # Seven gates at once, in this checkout: receipts fresh, pictures rebuilt
          # from them, ledger invariants, claims vs receipts, index current.
          python tools/stranger_own_check.py
          # And the one-screen page a stranger opens offline must still say
          # the numbers the receipt says, and must not link out to anyone.
          python tools/render_outsider_board.py --check
          python tools/outsider_rerun.py --inventory-check
          python tools/check_competitor_vectors.py \
            --dir docs/upstream-package/competitor-defects/v0.38.0 \
            --dir docs/upstream-package/competitor-defects/v0.38.0-counter --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); u=[v for dd in d['dirs'] for v in dd['vectors'] if dd['dir'].rstrip('/').endswith('/v0.38.0') or dd['dir'].rstrip('/')=='v0.38.0']; c=[v for dd in d['dirs'] for v in dd['vectors'] if 'counter' in dd['dir']]; assert len(u)==3 and not any(v['agrees'] for v in u), u; assert len(c)==3 and all(v['agrees'] for v in c), c; print('upstream 0/3 agree, counter 3/3 agree')"


      - name: Every check has an artefact that makes it fail
        # Nineteen checks, and for each one a package (or, for S9 and S16, a
        # mutation run by outsider_audit) that drives it to FAIL. A check
        # nobody can make fail is decoration; this step refuses decoration.
        run: python tools/check_falsifiability.py

      - name: Two defects at once must not explain each other away
        # One mutation at a time is measured everywhere else. Two together is a
        # different question: a second change can supply exactly the consistency
        # the first one broke. Fourteen mutations, every pair and every triple.
        run: python tools/check_combinations.py --triples

      - name: A forgery that agrees with itself
        # Repairing a rewrite is arithmetic; a stranger can do it and sign with
        # their own key. What has to survive is the sentence the verdict makes:
        # PASS beside unanchored, never PASS alone.
        run: python tools/composed_forgery.py

      - name: An anchor must arrive from outside the bundle
        # Build a publisher bundle, then check it the way a stranger would. The
        # same package verified against its own key is PASS/unanchored; the anchor
        # is what turns it into ANCHORED, so this step fails if either half stops
        # mattering.
        run: |
          python tools/make_release_bundle.py --out /tmp/anchor-demo
          python tools/anchor_check.py /tmp/anchor-demo

      - name: One file, no install
        # Build the zipapp, strip the path, and run it from an empty directory.
        # "No install required" is a claim a stranger should be able to check,
        # so CI checks it rather than the README asserting it.
        run: |
          python tools/build_zipapp.py --out /tmp/uibc.pyz
          mkdir -p /tmp/isolated && cd /tmp/isolated
          python /tmp/uibc.pyz explain "$GITHUB_WORKSPACE/fixtures/clean.uibc" | head -3

      - name: The anchor in the tree still verifies
        run: python -m pytest tests/test_published_anchor.py -q

      - name: The dashboard and the runner agree on seven checks
        run: python -m pytest tests/test_run_all_evidence.py -q

      - name: The 0.4.0 pin is still plain sha256sum
        run: python -m pytest tests/test_release_pin.py -q

      - name: The anchor channel is named in exactly one place
        run: python -m pytest tests/test_channel.py -q

      - name: The witness constants still match what we cite
        # Offline by design: the live check (tools/check_witnesses.py) needs three
        # third-party services, and their outage must not colour our CI.
        run: python -m pytest tests/test_witnesses.py -q

      - name: The line of anchors, judged by both implementations
        # Includes the end-to-end rehearsal: build, link, judge four questions
        # with python and node in a stripped environment, under a second.
        run: python -m pytest tests/test_chain_second_impl.py -q

      - name: A stale anchor has to be distinguishable from a current one
        # Six refusals and one STALE: gap, replay, rewritten predecessor, a
        # first anchor claiming a predecessor, withheld anchors, rollback.
        run: python -m pytest tests/test_anchor_chain.py -q

      - name: The publisher check, done twice
        # anchor_check.py and verify-js/anchor.mjs must reach the same verdict
        # on the same bundle - agreement is the only reason to believe either.
        run: python -m pytest tests/test_anchor_second_impl.py -q

      - name: An anchor can carry a moment, and must not lie about it
        # Offline against a real FreeTSA token shipped as a fixture; the four
        # refusals (wrong bytes, no CA, wrong cover mode, missing half) are what
        # make the optional block worth anything.
        run: python -m pytest tests/test_anchor_check.py -q

      - name: The second implementation must not drift
        # A verifier written from the spec in another language, sharing no code
        # with the first, is only worth something while it keeps agreeing. This
        # step fails the build when it stops: an accepted package it rejects, a
        # refused package it fails for an unrelated reason, or a check the
        # Python side gained that the JavaScript side never carried.
        run: python tools/assert_second_impl.py

  # Measured 2026-11-25: the crosswalk had no gate at all. `crosswalk/*.json` and
  # `tools/out/crosswalk-*.json` could drift apart, a clause could be demoted from
  # carried to partial, or a declared probe could start failing, and CI would stay
  # green - the counts in the documents were reproducible only by whoever ran the
  # tool by hand. This job re-runs every probe and compares the fresh result with
  # the committed file byte for byte (exit 3 on any difference), so a reader can
  # re-run the same thing and get the same numbers, and a demotion cannot be made
  # quietly. It also re-checks the generated evidence index against its sources.
  crosswalk-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test deps
        run: |
          python -m pip wheel --wheel-dir .ci-wheels pytest ".[verify]"
          python -m pip install --no-deps .ci-wheels/*.whl

      - name: Install the package
        run: |
          python -m pip wheel --wheel-dir .ci-wheels .
          python -m pip install --no-deps .ci-wheels/*.whl

      - name: Every crosswalk reproduces its committed result
        # One command, the same one a reader runs. It re-runs every probe, compares
        # each fresh result with the committed file byte for byte, and prints the
        # first differing line when they disagree (byte counts alone did not say
        # which field moved the first time this failed on Linux). A failing probe
        # on any non-gap row is OVERCLAIM; drift is exit 3.
        run: python tools/recheck.py

      - name: The evidence index matches its sources
        run: python tools/build_evidence_index.py --check

  # TC-4 says probe strings are handed to the platform shell, so quoting and path
  # rules differ between POSIX sh and cmd.exe. `crosswalk-gate` above runs the
  # probes under bash; until this job existed, nothing in CI had ever executed a
  # probe string under cmd.exe - the Windows job only ran static tests
  # (`evaluate(run=False)`), which is the opposite of what TC-4's reason claimed.
  # Same command as a reader would run, so the workflow and the reader agree.
  windows-probes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install test deps
        shell: bash
        run: |
          python -m pip wheel --wheel-dir .ci-wheels pytest ".[verify]"
          python -m pip install --no-deps .ci-wheels/*.whl

      - name: Install the package
        shell: bash
        run: |
          python -m pip wheel --wheel-dir .ci-wheels .
          python -m pip install --no-deps .ci-wheels/*.whl

      - name: Every crosswalk reproduces its committed result under cmd.exe
        run: python tools/recheck.py

      - name: The probe command is wired to more than one family
        run: python tools/probe_platform_matrix.py

      # First run of this job: 21cfr11 and tool-contract reported OVERCLAIM on
      # Windows - the probe rows that shell out to pytest failed, while the rows
      # that run tools/*.py all reproduced clean. recheck prints only the first
      # differing line, so the job said nothing about why. This step exists to
      # make the failure legible, and it runs only when something above failed.
      - name: Why the probes failed (diagnosis only)
        if: failure()
        run: python -m pytest tests/test_crosswalk_probe.py tests/test_actor_attribution.py -q --tb=short

  # Fuzzing that runs, not fuzzing that is merely filed. The harness is the
  # canonicaliser's three load-bearing properties: total on whatever
  # `json.loads` accepts, a fixpoint (canonicalise of canonical form is the
  # same bytes), and independent of key insertion order. A failure here is a
  # counterexample, so the job is red only when one was found: libFuzzer exits
  # 0 when `-max_total_time` runs out. The budget is deliberately small - 30
  # seconds per push, against a pure-Python function that is already covered by
  # the RFC 8785 vectors in tests/test_canonical.py. The point is to keep the
  # corpus alive between pushes, not to replace the vectors.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the package and the fuzzer
        run: |
          # atheris 2.3.0 publishes cp312 manylinux wheels; if the wheel is
          # missing the source build needs clang, which ubuntu-latest has.
          python -m pip wheel --wheel-dir .ci-wheels . atheris
          python -m pip install --no-deps .ci-wheels/*.whl

      - name: Fuzz the canonicaliser for 30 seconds
        run: python fuzz/fuzz_jcs.py -max_total_time=30 -print_final_stats=1

