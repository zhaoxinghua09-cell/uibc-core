name: security-baseline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install zizmor
        run: python -m pip install --upgrade pip && pip install zizmor
      - name: Run zizmor (GitHub Actions static analysis)
        run: zizmor --min-severity medium --no-progress .
        # ⚠️ advisory 期：首次接入，允许存量告警不阻断；清理后移除 continue-on-error 收紧
        continue-on-error: true
