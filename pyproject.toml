[project]
name = "uibc-core"
version = "0.3.0"
description = "UIBC Core reference implementation v0.3.0 - agent lifecycle evidence packaging and verification with three-valued verdicts and public Ed25519 seals. LGD: registry / evidence / gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Xinghua Zhao" }]
keywords = ["ai-agent", "provenance", "evidence", "attestation", "verification", "ed25519", "lifecycle", "governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/zhaoxinghua09-cell/uibc-core"
Repository = "https://github.com/zhaoxinghua09-cell/uibc-core"
Issues = "https://github.com/zhaoxinghua09-cell/uibc-core/issues"

[project.scripts]
uibc = "uibc_core.cli:main"
uibc-mcp = "uibc_core.mcp_server:main"
uibc-core = "uibc_core.mcp_server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["uibc_core*"]
