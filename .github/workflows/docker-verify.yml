name: docker-verify

# The reviewer's half-sentence: "a Dockerfile pinned to a base-image digest".
#
# Two jobs, two claims:
#   base-pin        - the reference in docker/base-image.pin is a digest, the
#                     Dockerfile quotes that same reference, and the registry still
#                     resolves the digest (a pin nobody can pull is not a pin).
#   container-check - build that image and run the four outsider steps inside it,
#                     then export the image as a tar and attest the tar's bytes.
#
# The second job is deliberately not "build and do not run": an image that builds
# proves the Dockerfile parses; it is the run inside it that says the environment
# reproduces the four steps.

on:
  pull_request:
    paths:
      - "docker/**"
      - "tools/check_base_image_pin.py"
      - "tools/outsider_rerun.py"
      - "docs/TRACKED-FILES.txt"
      - ".github/workflows/docker-verify.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base-pin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: The pin is a digest and the Dockerfile quotes it
        run: python tools/check_base_image_pin.py --registry

  container-check:
    runs-on: ubuntu-latest
    needs: base-pin
    permissions:
      contents: read
      id-token: write        # OIDC identity for the image tar attestation
      attestations: write    # required to persist it (see build-provenance.yml)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the verifier image from the pinned base
        run: docker build -f docker/Dockerfile -t uibc-verify:${{ github.sha }} .

      - name: State what was built (image id, base, interpreter, pytest)
        run: |
          docker image inspect --format 'image id {{.Id}}' uibc-verify:${{ github.sha }}
          echo "base (from the pin, enforced by base-pin): $(grep -v '^#' docker/base-image.pin | tail -1)"
          docker run --rm uibc-verify:${{ github.sha }} \
            python -c "import sys, pytest; print('python', sys.version.split()[0], 'pytest', pytest.__version__)"
          sha256sum docker/base-image.pin docker/requirements-verify.txt

      - name: Four steps inside the pinned environment
        run: |
          set -o pipefail
          docker run --rm uibc-verify:${{ github.sha }} | tee container-run.log

      - name: The steps have to pass here, not only in a receipt
        run: |
          grep -c -E "PASS (gate|parity|demo|tests) " container-run.log | grep -Fx 4
          grep -F "OUTSIDER OK" container-run.log

      - name: The shipped receipt still answers for the shipped tree
        run: |
          set -o pipefail
          docker run --rm uibc-verify:${{ github.sha }} \
            python tools/outsider_rerun.py --check | tee container-check.log

      - name: The check has to say the membership and the receipt agree
        run: |
          grep -F "INVENTORY OK" container-check.log
          grep -E "(OUTSIDER OK: receipt matches|VERDICT: DELIVERY MATCH)" container-check.log
          grep -F "timestamp:" container-check.log

      - name: Export the image and attest its bytes (push to main only)
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist-image
          docker save uibc-verify:${{ github.sha }} -o dist-image/uibc-verify-image.tar
          sha256sum dist-image/uibc-verify-image.tar
          wc -c dist-image/uibc-verify-image.tar

      - name: Generate artifact attestation for the verifier image tar
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist-image/uibc-verify-image.tar"

      - name: Upload the container run log (always, it is the evidence)
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: container-run-log
          path: |
            container-run.log
            container-check.log
          if-no-files-found: warn
