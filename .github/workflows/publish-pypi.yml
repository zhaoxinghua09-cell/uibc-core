name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0 # v4
      - uses: actions/setup-python@v7.1.0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4.6.2 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      # Required to upload attestations. build-provenance.yml already says so:
      # "id-token: write alone is NOT enough - attestations: write is the minimum
      # additional permission". It was noted in the file that does not publish.
      attestations: write
    env:
      UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4.4.0 # v4
      - uses: actions/download-artifact@v8.0.2 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish (Trusted Publishing)
        id: oidc
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@v1.14.3 # v1.14.3
      - name: Publish (API token fallback)
        # Kept for now, but it is why 0.5.0 has no provenance: an upload through a
        # long-lived token carries no attestation, and this path is silent
        # (continue-on-error on both steps). Remove the fallback once OIDC is
        # confirmed stable, then delete the secret.
        if: steps.oidc.outcome == 'failure' && env.UV_PUBLISH_TOKEN != ''
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip uv
          uv publish --token "$UV_PUBLISH_TOKEN"
      - name: Verify the version is actually on PyPI
        if: always()
        env:
          PKG: uibc-core
          MANIFEST: pyproject.toml
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json, os, re, sys, time, urllib.request
          pkg = os.environ["PKG"]
          want = (os.environ.get("TAG") or "").lstrip("v")
          if not want:
              # workflow_dispatch has no tag: fall back to the version declared in the manifest
              txt = open(os.environ["MANIFEST"], encoding="utf-8").read()
              m = re.search(r'^version\s*=\s*"([^"]+)"', txt, re.M)
              want = m.group(1) if m else ""
              print("no tag event; manifest says %s" % want)
          if not want:
              print("cannot determine a version to verify")
              sys.exit(1)
          op = urllib.request.build_opener()
          for attempt in range(12):
              try:
                  with op.open("https://pypi.org/pypi/%s/json" % pkg, timeout=20) as r:
                      have = list((json.load(r).get("releases") or {}).keys())
                  if want in have:
                      print("VERIFIED %s %s on PyPI" % (pkg, want))
                      sys.exit(0)
                  print("poll %d: %s not released yet (latest known: %s)" % (attempt + 1, want, have[-3:]))
              except Exception as e:
                  print("poll %d error: %s" % (attempt + 1, e))
              time.sleep(10)
          print("NOT ON PYPI: %s %s - the publish step reported success but published nothing" % (pkg, want))
          sys.exit(1)
          PY
      - name: Verify provenance exists for every uploaded file
        # The step above proves the version exists; it never proves the security
        # signal exists. 0.5.0 passed that check while every provenance URL
        # returned 404. A check that cannot fail on the property you care about is
        # not a check, so this one asks PyPI for the attestation itself.
        if: always()
        env:
          PKG: uibc-core
          MANIFEST: pyproject.toml
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import json, os, re, sys, urllib.request
          pkg = os.environ["PKG"]
          want = (os.environ.get("TAG") or "").lstrip("v")
          if not want:
              txt = open(os.environ["MANIFEST"], encoding="utf-8").read()
              m = re.search(r'^version\s*=\s*"([^"]+)"', txt, re.M)
              want = m.group(1) if m else ""
          if not want:
              print("cannot determine a version; refusing to claim provenance")
              sys.exit(1)
          data = json.load(urllib.request.urlopen("https://pypi.org/pypi/%s/json" % pkg, timeout=20))
          files = [f["filename"] for f in (data.get("releases") or {}).get(want, [])]
          if not files:
              print("no files published for %s %s" % (pkg, want))
              sys.exit(1)
          missing = []
          for fn in files:
              url = "https://pypi.org/integrity/%s/%s/%s/provenance" % (pkg, want, fn)
              try:
                  urllib.request.urlopen(url, timeout=20).read()
                  print("provenance present: %s" % fn)
              except Exception as e:
                  missing.append((fn, str(e)))
          for fn, e in missing:
              print("MISSING provenance: %s (%s)" % (fn, e))
          sys.exit(1 if missing else 0)
          PY
