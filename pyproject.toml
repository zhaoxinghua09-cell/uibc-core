[project]
name = "uibc-core"
version = "0.3.0"
description = "UIBC Core reference implementation (v0.2.1 PROPOSAL) - agent lifecycle evidence packaging and verification. LGD: registry / evidence / gates."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.scripts]
uibc = "uibc_core.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["uibc_core*"]
