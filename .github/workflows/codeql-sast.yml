name: codeql-sast

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.39.4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4.39.4
        with:
          upload: false
