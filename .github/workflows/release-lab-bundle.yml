name: Release lab bundle

# Runs when a maintainer pushes a version tag. It builds the release lab bundle
# (three controls measured in throwaway directories), checks it, and attaches the
# bundle, the receipt and the digest list to the GitHub release. It never publishes
# anything on its own: a tag push is a human decision.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the bundle to"
        required: true

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Work out the version
        id: v
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Build the bundle and measure the controls
        run: |
          python tools/release_lab_bundle.py --version "${{ steps.v.outputs.version }}" --out release

      - name: Refuse a bundle that does not recompute
        run: |
          python tools/check_lab_bundle.py "release/uibc-lab-bundle-${{ steps.v.outputs.version }}.json" \
            --archive "release/uibc-conformance-${{ steps.v.outputs.version }}.zip"

      - name: Sign the digest list, if a signing key is configured
        env:
          UIBC_RELEASE_SEED_HEX: ${{ secrets.UIBC_RELEASE_SEED_HEX }}
        run: |
          if [ -n "$UIBC_RELEASE_SEED_HEX" ]; then
            python tools/anchor_release_digests.py sign --file release/CORPUS-DIGESTS.txt --out-dir release
          else
            echo "no UIBC_RELEASE_SEED_HEX secret: this release's digest list ships unsigned" > release/UNSIGNED.txt
          fi

      - name: Try the two external anchors, recording what happened
        run: |
          python tools/anchor_release_digests.py anchor --file release/CORPUS-DIGESTS.txt --out-dir release || true

      - name: Verify the signature we just produced
        run: |
          if [ -f release/CORPUS-DIGESTS.txt.sig ]; then
            python tools/anchor_release_digests.py verify --sig release/CORPUS-DIGESTS.txt.sig
          else
            echo "unsigned (see release/UNSIGNED.txt)"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lab-bundle
          path: release/

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files="release/uibc-lab-bundle-${{ steps.v.outputs.version }}.json release/CORPUS-DIGESTS.txt release/receipt.json"
          for extra in release/CORPUS-DIGESTS.txt.sig release/ANCHORS.json \
                       release/anchor_freetsa.tsr release/anchor_freetsa_ca.pem \
                       release/UNSIGNED.txt release/CORPUS-DIGESTS.txt.ots; do
            [ -f "$extra" ] && files="$files $extra"
          done
          gh release upload "${{ steps.v.outputs.tag }}" $files --clobber
