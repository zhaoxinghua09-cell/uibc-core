# Deployment-side TLS / mTLS / ACL / rate limiting for the A2A gateway.
# The adapter itself speaks HTTP on loopback only; everything a network
# control plane is expected to do lives here, so 9.1.4 and 9.1.5 have a
# concrete artifact instead of a promise. tools/check_deploy_hardening.py
# lints this file; a missing directive fails the check rather than being
# silently ignored.

worker_processes auto;

events { worker_connections 1024; }

http {
    # ---- 9.1.5 b) rate limiting and connection caps ---------------------
    limit_req_zone  $binary_remote_addr zone=gw_req:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=gw_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # ---- 9.1.5 a) ACL allowlist ----------------------------------------
    # Replace with the peer gateway / CAICT portal egress ranges before use.
    geo $gw_acl {
        default        0;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
        127.0.0.1/32   1;
    }

    # ---- 9.1.4 a)-b) TLS + mutual auth ---------------------------------
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_client_certificate /etc/nginx/tls/peer-ca.pem;   # CA that issues peer certs
    ssl_verify_client      on;
    ssl_verify_depth       2;

    server {
        listen 443 ssl;
        server_name gateway.example.com;

        ssl_certificate     /etc/nginx/tls/gateway.pem;
        ssl_certificate_key /etc/nginx/tls/gateway.key;

        # 9.1.5 c) security zone separation: admin/metrics never share the
        # public listener with business traffic.
        location /a2a/ {
            if ($gw_acl = 0) { return 403; }
            limit_req  zone=gw_req burst=40 nodelay;
            limit_conn gw_conn 20;
            proxy_pass http://127.0.0.1:8080/a2a/;
            proxy_ssl_verify off;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-AUIB-Peer-Verified $ssl_client_verify;
            proxy_set_header X-AUIB-Peer-Subject  $ssl_client_s_dn;
        }

        location = /metrics {
            if ($gw_acl = 0) { return 403; }
            allow 127.0.0.1;
            deny  all;
            proxy_pass http://127.0.0.1:8080/metrics;
        }
    }

    # Plain HTTP listener exists only to redirect; no business traffic.
    server {
        listen 80;
        server_name gateway.example.com;
        return 301 https://$host$request_uri;
    }
}
