[project]
name = "uibc-core"
version = "0.5.0"
description = "UIBC Core reference implementation - agent lifecycle evidence packaging and verification with three-valued verdicts and public Ed25519 seals. LGD: registry / evidence / gates."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Xinghua Zhao" }]
keywords = ["ai-agent", "provenance", "evidence", "attestation", "verification", "ed25519", "lifecycle", "governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/zhaoxinghua09-cell/uibc-core"
Repository = "https://github.com/zhaoxinghua09-cell/uibc-core"
Issues = "https://github.com/zhaoxinghua09-cell/uibc-core/issues"

[project.scripts]
uibc = "uibc_core.cli:main"
uibc-mcp = "uibc_core.mcp_server:main"
uibc-core = "uibc_core.mcp_server:main"

[project.optional-dependencies]
# The verification path uses these two; the core needs neither. CI installs this extra
# so a green run means the real path was exercised, not a path with the hard parts skipped.
verify = ["cryptography>=41", "asn1crypto>=1.5", "securesystemslib>=1.6"]
# External conformance corpus (Sankalp Gilda's AEE predicate vectors). Not a runtime
# dependency: CI installs this extra to run the corpus harness against the
# uibc_core.aee rail; the rail itself is stdlib-only.
conformance = ["agent-evidence-vectors==0.36.3"]
# Test runner only. Thirteen test modules import pytest at module level, so the
# README's unittest entry cannot even collect them unless pytest is importable.
test = ["pytest>=8"]
# Measured 2026-11-19: 15 of the 16 tests that CI was skipping were skipping only
# because this extra was not installed. Installing it turns "527 OK (skipped=16)" into
# "527 OK (skipped=2)", and the two that remain are deliberate (a self-seeding path that
# is not taken when the corpus already exists, and a bare-environment control that is
# skipped once langchain-core is present). CI runs this extra in `test-with-extras`.
interop = [
  "agent-action-capsule==0.17.0",
  "langchain-core>=0.3",
  "opentimestamps-client>=0.7",
  "pynostr>=0.6",
  "coincurve>=18",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["uibc_core*"]

[tool.pytest.ini_options]
# audit/ holds point-in-time audit materials, not a test suite. In particular
# audit/20261121/p13_anchor_registry/test_anchor_registry.py runs its self-check
# at module import time and calls sys.exit(); because the file is named test_*.py
# pytest imports it during collection and aborts with INTERNALERROR (SystemExit: 0),
# so a clean clone cannot run `pytest` at all. Excluding audit/ lets a first-time
# reader run the suite with a bare `pytest`, while the self-check stays runnable
# directly:  python audit/20261121/p13_anchor_registry/test_anchor_registry.py
norecursedirs = [".git", ".venv", "venv", "build", "dist", "*.egg", "audit"]