name: Release lab bundle

# Runs when a maintainer pushes a version tag. It builds the release lab bundle
# (three controls measured in throwaway directories), checks it, and attaches the
# bundle, the receipt and the digest list to the GitHub release. It never publishes
# anything on its own: a tag push is a human decision.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the bundle to"
        required: true
      replace:
        description: "true to allow replacing assets that are already on the release"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # writes the release assets, this job only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The anchors need asn1crypto. Measured 2026-11-20 on the first real run of this
      # workflow: the job installed nothing, so the token could not even be requested
      # and ANCHORS.json recorded `NameError: name 'tsp' is not defined` - a dependency
      # missing, published as if it were a defect. Failure here is recorded, not fatal.
      - name: Install what the anchors need
        continue-on-error: true
        run: |
          python -m pip wheel --wheel-dir "$RUNNER_TEMP/ci-wheels" asn1crypto cryptography opentimestamps-client
          python -m pip install --no-deps "$RUNNER_TEMP/ci-wheels"/*.whl \
            || echo "could not install the anchor dependencies; ANCHORS.json will say unavailable"

      - name: Work out the version
        id: v
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      # A tag names one commit, so its release must be one set of bytes. Measured
      # 2026-11-20: a dispatch of the same tag rebuilt CORPUS-DIGESTS.txt to a different
      # digest than the tag push, because the bundle stamped the wall clock. The epoch
      # is the tag's commit time, which does not move.
      - name: Build the bundle and measure the controls
        run: |
          if [ -z "$SOURCE_DATE_EPOCH" ]; then
            export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          fi
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          python tools/release_lab_bundle.py --version "${{ steps.v.outputs.version }}" --out release

      - name: Refuse a bundle that does not recompute
        run: |
          python tools/check_lab_bundle.py "release/uibc-lab-bundle-${{ steps.v.outputs.version }}.json" \
            --archive "release/uibc-conformance-${{ steps.v.outputs.version }}.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lab-bundle
          path: release/

      # The digest list is signed only when a seed exists, and the absence is shipped
      # as a file rather than implied. The seed is never echoed; it reaches the step
      # through env and is not written to disk in any form the artifact could carry.
      - name: Sign the digest list, or record that it is unsigned
        env:
          SEED: ${{ secrets.UIBC_RELEASE_SEED_HEX }}
        run: |
          if [ -n "$SEED" ]; then
            UIBC_RELEASE_SEED_HEX="$SEED" python tools/anchor_release_digests.py sign \
              --file release/CORPUS-DIGESTS.txt \
              --out-dir release \
              --note "signed by the release workflow for ${{ steps.v.outputs.tag }}"
            python tools/anchor_release_digests.py verify --sig release/CORPUS-DIGESTS.txt.sig \
              --file release/CORPUS-DIGESTS.txt
          else
            printf '%s\n' "No signing key was configured for this release (UIBC_RELEASE_SEED_HEX absent)." \
              "The digest list below is NOT signed. Verify it by recomputing the hashes, not by a signature." \
              > release/UNSIGNED.txt
            echo "no seed configured: release/UNSIGNED.txt written, nothing signed"
          fi

      # Both anchors are attempted and their failures are recorded rather than retried
      # into success. `anchor` writes ANCHORS.json with one state per output.
      - name: Try the two external anchors
        continue-on-error: true
        run: |
          python tools/anchor_release_digests.py anchor \
            --file release/CORPUS-DIGESTS.txt \
            --out-dir release || echo "anchor step did not complete; ANCHORS.json says so if it exists"

      - name: Show the anchor states
        run: |
          if [ -f release/ANCHORS.json ]; then cat release/ANCHORS.json; else echo "no ANCHORS.json"; fi

      # A tag push alone does not create a release, and `gh release upload` fails when
      # there is none. Measured 2026-11-20: the repository had a v0.4.1 tag and no v0.4.1
      # release, which is why the only release asset for this corpus was 0.4.0. This step
      # opens the release if the tag has none, so the four artifacts have somewhere to go.
      #
      # It opens it as a DRAFT. Measured 2026-11-25 on run 45556633612 (v0.5.4): this
      # repository has immutable releases switched on, so a release created without
      # `--draft` published an empty one at once and the very next upload was refused with
      #   HTTP 422: Cannot upload assets to an immutable release
      # A published release can never gain assets here; a draft can, and publishing it
      # later fixes the byte set. The tag that carried that empty release became unusable
      # for any future release of the same name, which is why the assets for 0.5.4 live
      # on the conformance tag `uibc-conformance-0.5.4` pointing at the same commit.
      - name: Open the release if the tag has none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.v.outputs.tag }}" > /dev/null 2>&1; then
            echo "release already exists for ${{ steps.v.outputs.tag }}"
            gh release view "${{ steps.v.outputs.tag }}" --json isDraft,isImmutable \
              --jq '"draft=\(.isDraft) immutable=\(.isImmutable)"'
          else
            gh release create "${{ steps.v.outputs.tag }}" \
              --title "${{ steps.v.outputs.tag }}" \
              --draft \
              --generate-notes
            echo "opened ${{ steps.v.outputs.tag }} as a draft; it is published after it holds its bytes"
          fi

      # A published release is a fixed set of bytes, and this workflow broke that rule.
      # Measured 2026-11-20: it ran three times against one tag (runs 44669496764,
      # 44671945364, 44674184958), and each run rebuilt the bundle and the receipt with a
      # new wall-clock time, so the digest list changed and the token an outsider had
      # already verified at 04:05 no longer described the page by 04:24. Overwriting is
      # now opt-in, and the old digest is printed whenever it happens, so a rewrite is
      # visible on the run's log rather than only in hindsight.
      - name: Refuse to rewrite a published release unless asked
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLACE: ${{ github.event.inputs.replace || 'false' }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          if [ -z "$names" ]; then echo "no assets on $TAG yet"; fi
          for f in release/*; do
            name="$(basename "$f")"
            if printf '%s\n' "$names" | grep -qx "$name"; then
              old="$(gh release view "$TAG" --json assets \
                     --jq ".assets[] | select(.name == \"$name\") | .digest")"
              new="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
              if [ "$old" != "$new" ]; then
                echo "$name differs from the published copy: $old -> $new"
                if [ "$REPLACE" != "true" ]; then
                  echo "refusing to replace a published asset; re-run with replace=true to accept it"
                  exit 1
                fi
                echo "replace=true: the change above is on the record"
              fi
            fi
          done
          # A file that this run did not produce but the page still carries is stale by
          # definition: ANCHORS.json would describe this run while the token beside it
          # belongs to an older one.
          for name in CORPUS-DIGESTS.txt.sig anchor_freetsa.tsr anchor_freetsa_ca.pem \
                      CORPUS-DIGESTS.txt.ots ANCHORS.json UNSIGNED.txt; do
            if printf '%s\n' "$names" | grep -qx "$name" && [ ! -f "release/$name" ]; then
              echo "stale: $name is on the release but this run did not produce one"
            fi
          done

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.v.outputs.tag }}" \
            "release/uibc-conformance-${{ steps.v.outputs.version }}.zip" \
            "release/uibc-lab-bundle-${{ steps.v.outputs.version }}.json" \
            "release/CORPUS-DIGESTS.txt" \
            "release/receipt.json" \
            --clobber
          # Each optional artifact is attached only when it exists, so a missing signature
          # shows up as a missing file plus UNSIGNED.txt, never as a silent success.
          for f in release/CORPUS-DIGESTS.txt.sig release/anchor_freetsa.tsr \
                   release/anchor_freetsa_ca.pem release/CORPUS-DIGESTS.txt.ots \
                   release/ANCHORS.json release/UNSIGNED.txt; do
            if [ -f "$f" ]; then
              gh release upload "${{ steps.v.outputs.tag }}" "$f" --clobber
            else
              echo "not attached (absent): $f"
            fi
          done

      # A pin written by a human from memory is not a record. This step reads the
      # page it has just published and writes uibc-release-pin.json, which travels
      # with the release; the repository pin under anchors/pins/ is the stronger
      # form, because the page cannot rewrite it.
      - name: Record what this release holds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/make_release_pin.py --tag "${{ steps.v.outputs.tag }}" \
            --out "release/uibc-release-pin.json"
          gh release upload "${{ steps.v.outputs.tag }}" \
            "release/uibc-release-pin.json"
          echo "pin: release/uibc-release-pin.json is on the release"

      # Publishing is the last action, and it is what makes the page a fixed set of
      # bytes. Every asset above has to be in place first, because an immutable release
      # accepts no upload after it is published (measured 2026-11-25, run 45556633612).
      - name: Publish the release once it holds its bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft="$(gh release view "${{ steps.v.outputs.tag }}" --json isDraft --jq .isDraft)"
          if [ "$draft" = "true" ]; then
            gh release edit "${{ steps.v.outputs.tag }}" --draft=false
            echo "published ${{ steps.v.outputs.tag }}"
          else
            echo "${{ steps.v.outputs.tag }} was already published; its bytes stay as they are"
          fi
          gh release view "${{ steps.v.outputs.tag }}" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"'
