name: LGD CI

# 共享守门：布局 + JSON 卫生。业务测试保留在仓内自有 CI。
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ci:
    uses: LGD-AI/lgd-ci/.github/workflows/lgd-reusable-ci.yml@0e9aab43af6592beab8b67f2478ddb1dcf962969
    with:
      python-version: "3.11"
      run-tests: false
      require-skill-md: false