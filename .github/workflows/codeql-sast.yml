name: codeql-sast

on:
  # Every branch, not just main: a commit that is never scanned is a commit whose
  # findings arrive after the fact. OpenSSF Scorecard reads the triggers, and it
  # says exactly that ("SAST tool detected but not run on all commits").
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          languages: python
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          upload: false
