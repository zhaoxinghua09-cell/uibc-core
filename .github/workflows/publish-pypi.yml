name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing (OIDC); a token fallback runs only if the publisher is not registered
    env:
      UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish (Trusted Publishing)
        id: oidc
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish (API token fallback)
        if: steps.oidc.outcome == 'failure' && env.UV_PUBLISH_TOKEN != ''
        run: |
          python -m pip install --upgrade pip uv
          uv publish --token "$UV_PUBLISH_TOKEN"
